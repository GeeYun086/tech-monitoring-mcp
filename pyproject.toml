[project]
name = "tech-monitoring-mcp"
version = "0.2.0"
description = "AX 시장 모니터링 — 큐레이션 검색엔진 + 구글 검색 API + Gemini 동의어 병합"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "google-genai>=1.0",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
